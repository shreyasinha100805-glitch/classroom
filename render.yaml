services:
  - type: web
    name: classroom-board-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app --config gunicorn.conf.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      # CPU thread limits — keep RSS well below 512 MB
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      # Image size limits (decompression bomb prevention)
      - key: PREPROCESS_MAX_DIM
        value: "960"
      - key: MAX_UPLOAD_PIXELS
        value: "8000000"
