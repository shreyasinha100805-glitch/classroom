services:
  - type: web
    name: classroom-board-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
    startCommand: "gunicorn app:app --config gunicorn.conf.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: TORCHDYNAMO_DISABLE
        value: "1"
      - key: TORCH_COMPILE_DISABLE
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
      - key: PREPROCESS_MAX_DIM
        value: "960"
      - key: MAX_UPLOAD_PIXELS
        value: "8000000"
