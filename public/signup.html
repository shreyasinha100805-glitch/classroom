<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Classroom Board Content Extractor</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Dynamic Constellation Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Ambient Glowing Gradient Orbs -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-wrapper">
        <!-- Top Navigation -->
        <nav class="navbar">
            <div class="container nav-container">
                <a href="/" class="brand-logo">
                    <div class="logo-icon-wrap">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                        </svg>
                    </div>
                    <div class="brand-text">
                        Board<span>AI</span><span class="brand-sub-badge">AI Studio</span>
                    </div>
                </a>

                <div class="nav-links">
                    <div class="theme-palette-picker" title="Switch Color Theme">
                        <span class="theme-picker-label">Theme</span>
                        <button type="button" class="theme-dot-btn active" data-set-theme="cyberpunk" title="Neon Cyberpunk">
                            <span class="theme-dot dot-cyberpunk"></span>
                        </button>
                        <button type="button" class="theme-dot-btn" data-set-theme="aurora" title="Cosmic Aurora">
                            <span class="theme-dot dot-aurora"></span>
                        </button>
                        <button type="button" class="theme-dot-btn" data-set-theme="solar" title="Solar Flare">
                            <span class="theme-dot dot-solar"></span>
                        </button>
                        <button type="button" class="theme-dot-btn" data-set-theme="hyperdrive" title="Hyperdrive Blue">
                            <span class="theme-dot dot-hyperdrive"></span>
                        </button>
                    </div>

                    <a href="/" class="nav-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Home
                    </a>
                    <a href="/login.html" class="nav-btn btn-nav-login">
                        Log In
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Authentication Section -->
        <main class="container auth-page-container">
            <div class="auth-card-panel">
                <div class="auth-header">
                    <div class="auth-icon-bubble">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                    </div>
                    <h2 class="auth-title">Create Account</h2>
                    <p class="auth-subtitle">Join BoardAI to extract notes, organize lectures, and synthesize study summaries.</p>
                </div>

                <!-- Alert Box -->
                <div id="auth-alert-box" class="auth-alert-box" style="display: none;">
                    <span id="auth-alert-text"></span>
                </div>

                <!-- Signup Form -->
                <form class="auth-form" id="signup-form" method="POST" action="/signup">
                    <div class="auth-input-group">
                        <label for="username" class="auth-label">Username</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="auth-input"
                                placeholder="Choose a username (min 3 chars)"
                                required
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <label for="email" class="auth-label">Email Address</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="auth-input"
                                placeholder="student@university.edu"
                                required
                            >
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <label for="password" class="auth-label">Password</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="auth-input"
                                placeholder="Minimum 6 characters"
                                required
                            >
                            <button type="button" class="btn-toggle-password" id="toggle-password" title="Show/Hide Password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <label for="confirm_password" class="auth-label">Confirm Password</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="auth-input"
                                placeholder="Re-enter your password"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn-neural-submit auth-submit-btn" id="signup-submit-btn">
                        <span>Create Account</span>
                        <svg class="btn-icon-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="auth-footer-link">
                    Already registered? <a href="/login.html">Log in to your account</a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer style="margin-top: auto; padding: 25px 0; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.82rem; color: var(--text-muted);">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div>
                    AI Classroom Board Content Extractor • Secure Authentication
                </div>
                <div>
                    <a href="/" style="color: var(--primary-cyan); text-decoration: none;">Back to Studio</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/script.js"></script>
    <script>
        const toggleBtn = document.getElementById('toggle-password');
        const pwdInput = document.getElementById('password');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', () => {
                const isPwd = pwdInput.type === 'password';
                pwdInput.type = isPwd ? 'text' : 'password';
                toggleBtn.style.color = isPwd ? 'var(--primary-cyan)' : 'var(--text-muted)';
            });
        }
    </script>
</body>

</html>
